# ---------------------------------------------------------------------------
# DentalCRM — déploiement Docker Compose (compatible Coolify « Docker Compose »)
#   app       : interface web Filament + webhooks Ringover (port 8080)
#   queue     : traitement en arrière-plan (imports, IA, webhooks)
#   scheduler : tâches planifiées (synchro Ringover, notifications de rappels)
# Les variables sont lues depuis le .env (ou l'onglet « Environment Variables » de Coolify).
# ---------------------------------------------------------------------------
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: dentalcrm:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false                # Coolify génère le .env ; facultatif pour que le build ne bloque pas
  # Toutes les variables utiles sont déclarées explicitement : selon sa version, Coolify ne transmet pas
  # forcément son .env aux conteneurs. Chaque ${VAR} apparaît aussi dans l'onglet « Environment Variables ».
  environment: &app-env
    APP_NAME: ${APP_NAME:-DentalCRM}
    APP_ENV: production
    APP_KEY: ${APP_KEY:?APP_KEY est obligatoire (php artisan key:generate --show)}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:?APP_URL est obligatoire (https://crm.votre-domaine.fr)}
    APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
    APP_LOCALE: fr
    APP_FALLBACK_LOCALE: fr
    LOG_CHANNEL: stderr                # les erreurs Laravel s'affichent dans les logs Coolify du conteneur
    LOG_LEVEL: ${LOG_LEVEL:-warning}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-crm}   # mêmes valeurs que le service mysql
    DB_USERNAME: ${DB_USERNAME:-crm}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PASSWORD: "null"
    REDIS_PORT: "6379"
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    SESSION_LIFETIME: "480"
    SESSION_ENCRYPT: "true"
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
    MAIL_FROM_NAME: ${APP_NAME:-DentalCRM}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    ANTHROPIC_MODEL_FAST: ${ANTHROPIC_MODEL_FAST:-claude-haiku-5-5}
    AI_COMPANY_CONTEXT: ${AI_COMPANY_CONTEXT:-}
    RINGOVER_API_KEY: ${RINGOVER_API_KEY:-}
    RINGOVER_BASE_URL: ${RINGOVER_BASE_URL:-https://public-api.ringover.com/v2}
    RINGOVER_WEBHOOK_TOKEN: ${RINGOVER_WEBHOOK_TOKEN:-}
    ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    PHP_OPCACHE_ENABLE: "1"
    PHP_MEMORY_LIMIT: 512M
    PHP_UPLOAD_MAX_FILE_SIZE: 50M
    PHP_POST_MAX_SIZE: 50M
    AUTORUN_ENABLED: "false"
    NGINX_LISTEN_IP_PROTOCOL: ipv4    # évite un crash nginx sur les VPS sans IPv6 (Traefik passe en IPv4)
  volumes:
    - storage:/var/www/html/storage/app
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "true"          # migrations + caches au démarrage
      AUTORUN_LARAVEL_MIGRATION: "true"
      CRM_IS_WEB: "true"
    expose:
      - "8080"                         # Coolify : déclarer le domaine sur app:8080 (Traefik gère le HTTPS)
                                       # En local, docker-compose.override.yml publie le port APP_PORT
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  queue:
    <<: *app
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=180", "--max-time=3600", "--sleep=1"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 20s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 20s
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-crm}
      MYSQL_USER: ${DB_USERNAME:-crm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD est obligatoire}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql          # nouveau volume : MySQL repart à neuf avec les identifiants actuels
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  storage:
  mysql_data:
  redis:
